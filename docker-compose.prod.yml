services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file:
      - ./backend/.env
    environment:
      CORS_ORIGINS: '["http://127.0.0.1:${PROD_HTTP_PORT:-8080}","http://localhost:${PROD_HTTP_PORT:-8080}"]'
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROD_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
