services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ${HOME}/.aws:/root/.aws:ro
      - history_data:/data
    env_file:
      - ./backend/.env
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - HISTORY_DB_PATH=/data/history.sqlite3

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  history_data:
